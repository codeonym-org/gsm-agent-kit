[project]
name = "gsm-agent-kit"
version = "0.1.0"
description = "A hexagonal SMS assistant for a ZTE USB modem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "dishka>=1.10.1",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.5",
    "langchain-openrouter>=0.2.9",
    "markdown-it-py>=4.2.0",
    "mediary[anyio,dishka,fastapi,otel]>=0.4.0",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]
