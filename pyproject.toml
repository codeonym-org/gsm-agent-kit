[project]
name = "gsm-agent-kit-workspace"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/core", "libs/gsm-agent", "libs/standard-tests", "libs/kit", "libs/integrations/devices/*", "libs/integrations/modems/*", "libs/integrations/ai/*", "libs/integrations/storage/*", "apps/server", "apps/cli"]

[dependency-groups]
dev = [
    "commitizen>=4.19.3",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "apps/server/tests", "apps/cli/tests", "tests/e2e"]
norecursedirs = [".v0", ".venv", "node_modules"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = [".v0"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.commitizen]
name = "cz_conventional_commits"
allowed_prefixes = ["Merge", "Revert", "fixup!", "squash!"]

[tool.pyright]
include = ["libs", "apps/server", "apps/cli/src", "scripts"]
exclude = [".v0", ".venv", "**/node_modules"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
