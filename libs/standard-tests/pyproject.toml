[project]
name = "gsm-agent-standard-tests"
version = "0.1.0"
description = "Reusable integration contract tests."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    'gsm-agent-core',
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_standard_tests"]

[tool.uv.sources]
gsm-agent-core = { workspace = true }
