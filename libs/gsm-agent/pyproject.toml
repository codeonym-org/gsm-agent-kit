[project]
name = "gsm-agent"
version = "0.1.0"
description = "Reusable application workflows and CQRS handlers."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ['gsm-agent-core']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent"]

[tool.uv.sources]
gsm-agent-core = { workspace = true }
