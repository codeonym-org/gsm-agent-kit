[project]
name = "gsm-agent-kit"
version = "0.1.0"
description = "Optional installation bundles for GSM Agent Kit."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ['gsm-agent']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_kit"]

[tool.uv.sources]
gsm-agent = { workspace = true }
gsm-agent-cli = { workspace = true }
gsm-agent-zte-http = { workspace = true }
gsm-agent-serial-at = { workspace = true }
gsm-agent-modemmanager = { workspace = true }
gsm-agent-langchain = { workspace = true }
gsm-agent-sqlite = { workspace = true }
gsm-agent-server = { workspace = true }

[project.optional-dependencies]
server = ['gsm-agent-server']
cli = ['gsm-agent-cli']
zte-http = ['gsm-agent-zte-http']
serial-at = ['gsm-agent-serial-at']
modemmanager = ['gsm-agent-modemmanager']
langchain = ['gsm-agent-langchain']
sqlite = ['gsm-agent-sqlite']
zte-mf833t = [
    "gsm-agent-server[zte-mf833t]",
]
inbox = [
    "gsm-agent-server[inbox]",
]
sms = [
    "gsm-agent-server[sms]",
]
