[project]
name = "gsm-agent-simulated"
version = "0.1.0"
description = "Deterministic cellular-device adapter for local development and contract tests."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["gsm-agent-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_simulated"]

[tool.uv.sources]
gsm-agent-core = { workspace = true }
