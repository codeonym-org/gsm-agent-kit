[project]
name = "gsm-agent-zte-mf833t"
version = "0.1.0"
description = "Model-specific ZTE MF833T HTTP management adapter."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "gsm-agent-core",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_zte_mf833t"]

[tool.uv.sources]
gsm-agent-core = { workspace = true }
