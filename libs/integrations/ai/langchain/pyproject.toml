[project]
name = "gsm-agent-langchain"
version = "0.1.0"
description = "LangChain AI agent integration."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    'gsm-agent-core',
    "langchain>=1.0",
    "langchain-openrouter>=0.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_langchain"]

[tool.uv.sources]
gsm-agent-core = { workspace = true }
