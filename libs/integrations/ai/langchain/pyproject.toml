[project]
name = "gsm-agent-langchain"
version = "0.1.0"
description = "LangChain AI agent integration."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ['gsm-agent-core', 'gsm-agent']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_langchain"]

[tool.uv.sources]
gsm-agent-core = { workspace = true }
gsm-agent = { workspace = true }
