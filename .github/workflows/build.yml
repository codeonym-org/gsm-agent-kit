name: build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build --all-packages --out-dir dist
      - run: uvx twine check --strict dist/*
      - name: Smoke-test wheels and source distributions
        run: |
          uv venv /tmp/gsm-smoke --python 3.13
          uv export --locked --all-packages --all-extras --no-dev --no-emit-workspace --output-file /tmp/gsm-dependencies.txt
          uv pip install --python /tmp/gsm-smoke -r /tmp/gsm-dependencies.txt
          uv pip install --python /tmp/gsm-smoke --no-index --no-deps dist/*.whl
          uv pip check --python /tmp/gsm-smoke
          /tmp/gsm-smoke/bin/python -c 'import gsm_agent_core, gsm_agent, gsm_agent_kit, gsm_agent_server, gsm_agent_cli, gsm_agent_zte_http, gsm_agent_serial_at, gsm_agent_modemmanager, gsm_agent_langchain, gsm_agent_sqlite, gsm_agent_standard_tests, gsm_agent_simulated, gsm_agent_zte_mf833t'
          uv pip install --python /tmp/gsm-smoke hatchling
          uv pip install --python /tmp/gsm-smoke --no-deps --no-build-isolation --force-reinstall dist/*.tar.gz
          /tmp/gsm-smoke/bin/python -c 'import gsm_agent_core, gsm_agent, gsm_agent_kit, gsm_agent_server, gsm_agent_cli, gsm_agent_zte_http, gsm_agent_serial_at, gsm_agent_modemmanager, gsm_agent_langchain, gsm_agent_sqlite, gsm_agent_standard_tests, gsm_agent_simulated, gsm_agent_zte_mf833t'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
