name: conventions

on:
  pull_request:

permissions:
  contents: read

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check <type>/<issue>-<slug>
        env:
          BRANCH: ${{ github.head_ref }}
        run: python3 scripts/check_branch_name.py "$BRANCH"

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - name: Every commit in the PR is a conventional commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: uv run --no-sync cz check --rev-range "$BASE..$HEAD"
