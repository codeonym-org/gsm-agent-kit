name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run --no-sync ruff check --output-format=github .
      - run: uv run --no-sync ruff format --check .
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run --no-sync pyright
  test:
    name: test (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run --no-sync python scripts/check_workspace.py
      - run: uv run --no-sync python scripts/run_tests.py
  build-check:
    uses: ./.github/workflows/build.yml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-packages --all-extras
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:generate-api
      - run: git diff --exit-code -- apps/web/src/api/schema.d.ts
      - run: pnpm web:check
      - run: pnpm web:build
      - run: pnpm --filter @gsm-agent-kit/web exec playwright install --with-deps chromium
      - run: pnpm web:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: console-test-results
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/smoke_containers.py
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, build-check, web, containers]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "::error::A required CI job did not succeed"; exit 1
          fi
