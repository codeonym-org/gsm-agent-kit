version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: build
      include: scope
