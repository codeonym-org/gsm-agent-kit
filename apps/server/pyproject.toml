[project]
name = "gsm-agent-server"
version = "0.1.0"
description = "API transport, dependency injection and runtime composition."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "dishka>=1.10.1",
    "fastapi>=0.146.0",
    "filelock>=4.2.4",
    'gsm-agent',
    "gsm-agent-core",
    "mediary[dishka,fastapi,otel]>=0.4.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
    "websockets>=16.1.1",
]

[project.scripts]
gsm-agent-server = "gsm_agent_server.__main__:main"

[project.optional-dependencies]
simulated = [
    "gsm-agent-simulated",
]
zte-mf833t = [
    "gsm-agent-zte-mf833t",
]
inbox = [
    "gsm-agent-sqlite",
]
sms = [
    "gsm-agent-sqlite",
]
ai = [
    "gsm-agent-langchain",
    "gsm-agent-sqlite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_server"]

[tool.uv.sources]
gsm-agent = { workspace = true }
gsm-agent-simulated = { workspace = true }
gsm-agent-core = { workspace = true }
gsm-agent-zte-mf833t = { workspace = true }
gsm-agent-langchain = { workspace = true }
gsm-agent-sqlite = { workspace = true }
