[project]
name = "gsm-agent-server"
version = "0.1.0"
description = "API transport, dependency injection and runtime composition."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ['gsm-agent']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_server"]

[tool.uv.sources]
gsm-agent = { workspace = true }
