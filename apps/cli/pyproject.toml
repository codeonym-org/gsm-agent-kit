[project]
name = "gsm-agent-cli"
version = "0.1.0"
description = "Query-only operator CLI for the GSM Agent Kit API."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
]

[project.scripts]
gsm-agent = "gsm_agent_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsm_agent_cli"]
